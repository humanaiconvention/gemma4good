<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0B0B0F"/>

  <!-- Hairline connectors center to each label -->
  <g stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1" fill="none">
    <line x1="960" y1="500" x2="640" y2="280"/>
    <line x1="960" y1="500" x2="1280" y2="280"/>
    <line x1="960" y1="580" x2="500" y2="720"/>
    <line x1="960" y1="580" x2="1420" y2="720"/>
    <line x1="960" y1="610" x2="960" y2="820"/>
  </g>

  <!-- Center: Gemma 4 box -->
  <g>
    <rect x="850" y="500" width="220" height="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="960" y="548" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="500" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Gemma 4 E2B</text>
    <text x="960" y="578" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle" letter-spacing="0.5">+ LoRA adapter</text>
    <line x1="900" y1="588" x2="1020" y2="588" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="960" y="602" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#FFFFFF" fill-opacity="0.40" text-anchor="middle" letter-spacing="2">v42 · guarded</text>
  </g>

  <!-- Five tool nodes -->
  <g font-family="'JetBrains Mono', monospace" font-size="22" font-weight="500" text-anchor="middle">
    <g>
      <text x="640" y="270" fill="#FFFFFF" letter-spacing="1">wellbeing</text>
      <circle cx="640" cy="290" r="3" fill="#7DD3FC" fill-opacity="0.80"/>
    </g>
    <g>
      <text x="1280" y="270" fill="#FFFFFF" letter-spacing="1">consent</text>
      <circle cx="1280" cy="290" r="3" fill="#7DD3FC" fill-opacity="0.80"/>
    </g>
    <g>
      <text x="500" y="745" fill="#FFFFFF" letter-spacing="1">PRISM</text>
      <circle cx="500" cy="725" r="3" fill="#7DD3FC" fill-opacity="0.80"/>
    </g>
    <g>
      <text x="1420" y="745" fill="#FFFFFF" letter-spacing="1">NLA</text>
      <circle cx="1420" cy="725" r="3" fill="#7DD3FC" fill-opacity="0.80"/>
    </g>
    <g>
      <text x="960" y="850" fill="#FFFFFF" letter-spacing="1">Merkle receipt</text>
      <circle cx="960" cy="828" r="3" fill="#7DD3FC" fill-opacity="0.80"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="96" y="180" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="500" fill="#FFFFFF" fill-opacity="0.55" letter-spacing="3">FIVE GOVERNANCE TOOLS · ONE CRYPTOGRAPHIC RECEIPT</text>
  <line x1="96" y1="200" x2="1824" y2="200" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- Footer -->
  <text x="960" y="990" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF" fill-opacity="0.70" text-anchor="middle" letter-spacing="0.5">every decision passes all five · every decision is anchored</text>
</svg>
