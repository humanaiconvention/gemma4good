<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B0B0F"/>

  <!-- Logo mark top-left -->
  <g transform="translate(70, 60) scale(0.32)">
    <g transform="translate(0, 44.7)">
      <circle cx="100" cy="-18.6" r="18.1" fill="#FFFFFF"/>
      <path d="M 110.97 22 L 110.97 212 L 89.03 212 L 89.03 22 Z" fill="#FFFFFF"/>
      <path d="M 70.28 26.77 A 95 95 0 0 0 5 117 A 95 95 0 0 0 70.28 207.23 L 70.28 183.75 A 67 67 0 0 1 18.56 117 A 67 67 0 0 1 70.28 50.25 Z" fill="#FFFFFF"/>
      <path d="M 129.72 26.77 A 95 95 0 0 1 195 117 A 95 95 0 0 1 129.72 207.23 L 129.72 183.75 A 67 67 0 0 0 181.44 117 A 67 67 0 0 0 129.72 50.25 Z" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="160" y="100" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="1">HumanAI Convention</text>
  <text x="160" y="124" font-family="JetBrains Mono, monospace" font-size="12" font-weight="400" fill="#FFFFFF" fill-opacity="0.55" letter-spacing="3">GEMMA 4 GOOD</text>

  <!-- Main headline -->
  <text x="70" y="300" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-0.8">The Viability Condition</text>
  <text x="70" y="372" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-0.8">for Gemma 4.</text>

  <!-- Subtitles -->
  <text x="70" y="440" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" fill-opacity="0.80" letter-spacing="0.3">Grounded learning. Verifiable governance.</text>
  <text x="70" y="472" font-family="JetBrains Mono, monospace" font-size="22" font-weight="500" fill="#7DD3FC" letter-spacing="1">C_eff(t) &gt; E(t), per decision.</text>

  <!-- Bottom: anchor + PASS pill -->
  <g transform="translate(70, 620)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#FFFFFF" fill-opacity="0.55" letter-spacing="2">H26 PROMOTED ANCHOR</text>
    <text x="0" y="30" font-family="JetBrains Mono, monospace" font-size="20" font-weight="500" fill="#7DD3FC" fill-opacity="0.90" letter-spacing="0.5">4d0d7bf0…d8bb8</text>
  </g>
  <g transform="translate(960, 600)">
    <rect x="0" y="0" width="240" height="76" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.90" stroke-width="1.5"/>
    <text x="120" y="32" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#34D399" fill-opacity="0.90" text-anchor="middle" letter-spacing="2">52 H · 9 HYPOTHESES</text>
    <text x="120" y="62" font-family="JetBrains Mono, monospace" font-size="26" font-weight="500" fill="#34D399" text-anchor="middle" letter-spacing="1">7 PASS · 2 FAIL</text>
