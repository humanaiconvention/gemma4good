<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0B0B0F"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#FFFFFF">
    <text x="96" y="180" font-size="22" font-weight="400" fill-opacity="0.55" letter-spacing="2" font-family="'JetBrains Mono', monospace">THREE DEPLOYMENT SCENARIOS</text>
  </g>

  <!-- Card 1: Clinic -->
  <g transform="translate(180, 340)">
    <rect x="0" y="0" width="460" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
    <g stroke="#FFFFFF" stroke-width="1.5" fill="none" transform="translate(180, 70)">
      <circle cx="50" cy="30" r="14"/>
      <path d="M 50 44 L 50 90 Q 50 110 30 110 L 20 110"/>
      <path d="M 50 44 L 50 90 Q 50 110 70 110 L 80 110"/>
      <circle cx="20" cy="110" r="6"/>
      <circle cx="80" cy="110" r="6"/>
      <circle cx="50" cy="160" r="14" stroke-opacity="0.4"/>
    </g>
    <text x="40" y="380" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Rural clinic</text>
    <text x="40" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF" fill-opacity="0.70" letter-spacing="0.5">AI-assisted triage</text>
    <g transform="translate(40, 450)">
      <rect x="0" y="0" width="10" height="10" fill="#7DD3FC" fill-opacity="0.80"/>
      <text x="20" y="9" font-family="'JetBrains Mono', monospace" font-size="14" fill="#7DD3FC" fill-opacity="0.80" letter-spacing="1">receipt anchored</text>
    </g>
  </g>

  <!-- Card 2: Classroom -->
  <g transform="translate(730, 340)">
    <rect x="0" y="0" width="460" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
    <g stroke="#FFFFFF" stroke-width="1.5" fill="none" transform="translate(170, 70)">
      <rect x="0" y="0" width="120" height="90" rx="0"/>
      <line x1="20" y1="25" x2="100" y2="25"/>
      <line x1="20" y1="45" x2="80" y2="45"/>
      <line x1="20" y1="65" x2="60" y2="65" stroke="#7DD3FC" stroke-opacity="0.80"/>
      <line x1="62" y1="58" x2="62" y2="72" stroke="#7DD3FC" stroke-opacity="0.80"/>
      <path d="M 60 110 L 30 150 L 90 150 Z" stroke-opacity="0.4"/>
    </g>
    <text x="40" y="380" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Classroom</text>
    <text x="40" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF" fill-opacity="0.70" letter-spacing="0.5">Low-connectivity teaching</text>
    <g transform="translate(40, 450)">
      <rect x="0" y="0" width="10" height="10" fill="#7DD3FC" fill-opacity="0.80"/>
      <text x="20" y="9" font-family="'JetBrains Mono', monospace" font-size="14" fill="#7DD3FC" fill-opacity="0.80" letter-spacing="1">receipt anchored</text>
    </g>
  </g>

  <!-- Card 3: Satellite -->
  <g transform="translate(1280, 340)">
    <rect x="0" y="0" width="460" height="500" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
    <g stroke="#FFFFFF" stroke-width="1.5" fill="none" transform="translate(150, 60)">
      <ellipse cx="80" cy="40" rx="60" ry="20"/>
      <line x1="80" y1="60" x2="80" y2="100"/>
      <g stroke-opacity="0.5">
        <line x1="20" y1="130" x2="140" y2="130"/>
        <line x1="20" y1="150" x2="140" y2="150"/>
        <line x1="20" y1="170" x2="140" y2="170"/>
        <line x1="40" y1="120" x2="40" y2="180"/>
        <line x1="80" y1="120" x2="80" y2="180"/>
        <line x1="120" y1="120" x2="120" y2="180"/>
      </g>
      <rect x="60" y="148" width="20" height="20" fill="#F87171" fill-opacity="0.30" stroke="#F87171" stroke-opacity="0.70"/>
    </g>
    <text x="40" y="380" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Satellite</text>
    <text x="40" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF" fill-opacity="0.70" letter-spacing="0.5">Deforestation enforcement</text>
    <g transform="translate(40, 450)">
      <rect x="0" y="0" width="10" height="10" fill="#7DD3FC" fill-opacity="0.80"/>
      <text x="20" y="9" font-family="'JetBrains Mono', monospace" font-size="14" fill="#7DD3FC" fill-opacity="0.80" letter-spacing="1">receipt anchored</text>
    </g>
  </g>

  <text x="96" y="980" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="300" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="0.5">Every decision is hash-anchored. Every receipt is independently verifiable.</text>
</svg>
