app = "haic-maestro-gateway"
primary_region = "iad"

# Run `flyctl launch --copy-config --no-deploy` from the REPO ROOT.
# The Dockerfile copies both `utils/` and `maestro_gateway/`, so the build
# context must be the repo root — not the maestro_gateway/ subdirectory.
[build]
  dockerfile = "maestro_gateway/Dockerfile"

[env]
  MAESTRO_LAUNCH_MODE = "test"
  MAESTRO_RATE_LIMIT_S = "0.5"

# Set MAESTRO_DEV_TOKEN as a secret:
#   flyctl secrets set MAESTRO_DEV_TOKEN=$(openssl rand -hex 16)

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
